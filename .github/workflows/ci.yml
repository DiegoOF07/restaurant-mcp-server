name: CI

# Se ejecuta en cada push a main y en cada pull request hacia main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se hace push varias veces seguidas a la misma rama, cancela la
# ejecución anterior en curso — evita gastar minutos de CI en runs obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet and test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ["1.22"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Los siguientes archivos no están formateados con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v -race -cover

      - name: Build stdio binary (smoke check)
        run: go build -o bin/restaurant-mcp-server ./cmd/stdio

      - name: Manual protocol smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | ./bin/restaurant-mcp-server > /tmp/out.json
          grep -q '"result"' /tmp/out.json || (echo "El servidor no respondió como se esperaba" && exit 1)
          echo "Smoke test OK:"
          cat /tmp/out.json